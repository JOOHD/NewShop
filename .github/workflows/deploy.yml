name: Java CI with Gradle and Docker Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ① Checkout: 깃허브 저장소의 최신 코드를 가져온다.
      - uses: actions/checkout@v4

      # ② JDK 설정: Java 17 환경을 세팅한다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⑤ gradlew 실행 권한 부여: gradlew 파일에 실행 권한을 준다.
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ⑥ Gradle 세팅: Gradle 빌드 환경 준비
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3.1.0

      # ⑦ 빌드 실행: Java 프로젝트를 빌드 (jar 생성)
      - name: Build with Gradle Wrapper
        run: ./gradlew build

      # ⑧ Docker 이미지 빌드: Dockerfile을 기반으로 컨테이너 이미지 생성
      #    커밋 SHA로 태깅 = "이 이미지가 정확히 어느 커밋인지" 이름만 보고 확정할 수 있게 함
      #    latest도 같이 태깅 = EC2 쪽에서 매번 SHA를 몰라도 최신 버전만 편하게 pull 가능
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/shop:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/shop:latest \
            .

      # ⑨ push/PR 여부와 무관하게 여기까지는 항상 실행 — "빌드가 되는지" 자체가 PR 검증 항목
      #    아래(로그인/push/배포)부터는 main에 실제로 merge(push)됐을 때만 실행
      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ⑩ DockerHub에 푸시: 빌드한 이미지를 DockerHub 레지스트리에 업로드 (SHA 태그 + latest 태그 둘 다)
      - name: Push Docker Image to DockerHub
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/shop:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/shop:latest

      # ⑪ EC2에 SSH로 접속해서 방금 push한 이미지를 pull받아 컨테이너 재기동
      #    전제: EC2의 ~/jooshop 에 이 저장소가 git clone 되어 있어야 함 (docker-compose.prod.yml,
      #          nginx/ 폴더 포함) — 로드맵 2주차 회차6에서 준비
      #    docker-compose.prod.yml = 운영 전용 독립 파일. app을 build 대신 image(pull)로 띄움
      - name: Deploy to EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DOCKER_USERNAME
          script: |
            cd ~/jooshop
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v3.1.0
