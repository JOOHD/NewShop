<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문내역</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fragments/header.css">
</head>
<body class="bg-light">

<!-- 헤더 -->
<div th:replace="~{fragments/header :: headerWithBanner}"></div>

<div class="container mt-5" style="max-width: 900px;">
    <h2 class="mb-4">주문내역</h2>

    <div class="table-responsive">
        <table class="table table-hover align-middle" id="orderTable">
            <thead class="table-light">
            <tr>
                <th>주문번호</th>
                <th>상품</th>
                <th>총 결제금액</th>
                <th>주문 상태</th>
                <th>주문일시</th>
            </tr>
            </thead>
            <tbody>
            <!-- JS로 렌더링 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {

        function formatStatus(status) {
            switch (status) {
                case "PENDING": return "결제 대기";
                case "PAID": return "결제 완료";
                case "SHIPPED": return "배송 중";
                case "DELIVERED": return "배송 완료";
                default: return status ?? "알 수 없음";
            }
        }

        async function loadMyOrders() {
            const tbody = document.querySelector("#orderTable tbody");

            try {
                const res = await fetch("/api/v1/order/my");
                if (!res.ok) throw new Error("주문내역 조회 실패");

                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center">주문 내역이 없습니다.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                orders.forEach(o => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${o.orderId}</td>
                        <td>${o.productSummary ?? ""}</td>
                        <td>${Number(o.totalPrice).toLocaleString()}원</td>
                        <td>${formatStatus(o.status)}</td>
                        <td>${new Intl.DateTimeFormat("ko-KR", {
                            dateStyle: "medium",
                            timeStyle: "short"
                        }).format(new Date(o.orderDate))}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">주문내역을 불러오지 못했습니다.</td></tr>`;
            }
        }

        loadMyOrders();
    });
</script>
</body>
</html>
