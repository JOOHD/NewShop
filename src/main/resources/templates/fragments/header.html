<!-- fragments/header.html -->
<div th:fragment="headerWithBanner"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.w3.org/1999/xhtml">

    <!-- ==============================
         HEADER (흰 배경 고정 바)
         ============================== -->
    <header class="site-header">

        <!-- 좌측: 메뉴/검색 -->
        <div class="header-left">
            <button type="button"
                    class="icon-btn"
                    aria-label="메뉴"
                    onclick="toggleCategorySidebar()">
                <i class="fas fa-bars"></i>
            </button>

            <button type="button"
                    class="icon-btn"
                    aria-label="검색"
                    onclick="toggleSearchPanel()">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <!-- 중앙: 로고 -->
        <div class="header-center">
            <a href="/" class="header-logo-link" aria-label="홈">
                <span class="logo-text">JOO<span class="logo-accent">SHOP</span></span>
            </a>
        </div>

        <!-- 중앙: 내비게이션 -->
        <!-- 메뉴에 마우스를 올리면 전체 카테고리가 펼쳐지는 드롭다운(메가 메뉴) — 내용은 JS가 채운다 -->
        <nav class="header-nav" aria-label="카테고리 메뉴">
            <ul id="navList">
                <li><a href="/products">전체</a></li>
                <li id="navCollab"><a href="/products?collab=true">콜라보</a></li>
            </ul>

            <div class="mega" id="megaMenu">
                <div class="mega__cols" id="megaCols"></div>
            </div>
        </nav>

        <!-- 우측 아이콘 -->
        <div class="header-right">

            <!-- 비로그인 -->
            <div sec:authorize="isAnonymous()">
                <a href="/login" class="icon-link" aria-label="로그인">
                    <i class="fas fa-user"></i>
                </a>
            </div>

            <!-- USER -->
            <div class="user-icons" sec:authorize="hasRole('USER')">
                <a href="/profile"><i class="fas fa-user-circle"></i><span>내 정보</span></a>
                <a href="/orders"><i class="fas fa-box"></i><span>주문 내역</span></a>
                <a href="/wishlist"><i class="fas fa-heart"></i><span>위시리스트</span></a>
                <a href="/cart"><i class="fas fa-shopping-cart"></i><span>장바구니</span></a>

                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i><span>로그아웃</span>
                    </button>
                </form>
            </div>

            <!-- ADMIN -->
            <div class="admin-icons" sec:authorize="hasRole('ADMIN')">

                <div class="admin-dropdown">
                    <a href="/admin/products/list"
                       class="admin-dropdown-toggle"
                       aria-label="상품 관리">
                        <i class="fas fa-cubes"></i>
                    </a>

                    <div class="admin-dropdown-menu">
                        <a href="/admin/products/list">상품 목록</a>
                        <a href="/admin/products/register">상품 등록</a>
                    </div>
                </div>

                <a href="/admin/orders/list" aria-label="주문 관리">
                    <i class="fas fa-truck"></i>
                </a>

                <a href="/admin/members/list" aria-label="회원 관리">
                    <i class="fas fa-users"></i>
                </a>

                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i><span>로그아웃</span>
                    </button>
                </form>
            </div>

        </div>
    </header>

    <!-- ==============================
         카테고리 사이드바 (햄버거 버튼) — 모든 페이지 공통
         트리는 /api/v1/categorys 에서 읽어 JS로 그린다.
         ============================== -->
    <div class="cat-overlay" id="catOverlay" onclick="closeHeaderPanels()"></div>

    <aside class="cat-sidebar" id="catSidebar" aria-label="카테고리">
        <div class="cat-sidebar__head">
            <h3>카테고리</h3>
            <button type="button" class="icon-btn" aria-label="닫기" onclick="closeHeaderPanels()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="cat-tree" id="catTree">
            <li><a href="/products">전체 상품</a></li>
        </ul>
        <ul class="cat-tree cat-tree--extra">
            <li><a href="/products?collab=true">콜라보</a></li>
        </ul>
    </aside>

    <!-- 검색 패널 (돋보기 버튼) -->
    <aside class="cat-search" id="catSearch" aria-label="검색">
        <div class="cat-search__head">
            <button type="button" class="icon-btn" aria-label="검색 닫기" onclick="closeHeaderPanels()">
                <i class="fas fa-times"></i>
            </button>
            <span class="logo-text">JOO<span class="logo-accent">SHOP</span></span>
        </div>
        <form action="/items/search" method="get" class="cat-search__box">
            <i class="fas fa-search"></i>
            <input type="text" name="keyword" placeholder="제품, 카테고리 또는 브랜드 검색">
        </form>
    </aside>

    <script>
        function toggleCategorySidebar() {
            document.getElementById('catSearch')?.classList.remove('active');
            document.getElementById('catSidebar')?.classList.toggle('active');
            document.getElementById('catOverlay')?.classList.toggle('active');
        }

        function toggleSearchPanel() {
            document.getElementById('catSidebar')?.classList.remove('active');
            document.getElementById('catSearch')?.classList.toggle('active');
            document.getElementById('catOverlay')?.classList.toggle('active');
        }

        function closeHeaderPanels() {
            ['catSidebar', 'catSearch', 'catOverlay'].forEach(id =>
                document.getElementById(id)?.classList.remove('active'));
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeHeaderPanels(); });

        // 카테고리 트리 렌더링 — 최상위 카테고리와 그 하위 카테고리(예: 패션 > 상의, 하의)
        (function loadCategoryTree() {
            const tree = document.getElementById('catTree');
            if (!tree) return;

            const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

            fetch('/api/v1/categorys')
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(categories => {
                    const items = categories.map(c => {
                        const children = (c.children || []).map(ch =>
                            `<li><a href="/products?category=${ch.categoryId}">${esc(ch.name)}</a></li>`).join('');
                        return `<li>
                            <a class="cat-tree__top" href="/products?category=${c.categoryId}">${esc(c.name)}</a>
                            ${children ? `<ul class="cat-tree__children">${children}</ul>` : ''}
                        </li>`;
                    }).join('');
                    tree.insertAdjacentHTML('beforeend', items);

                    // 상단 내비게이션: 최상위 카테고리를 "콜라보" 앞에 끼워 넣는다
                    const collabItem = document.getElementById('navCollab');
                    categories.forEach(c => {
                        collabItem.insertAdjacentHTML('beforebegin',
                            `<li><a href="/products?category=${c.categoryId}">${esc(c.name)}</a></li>`);
                    });

                    // 드롭다운(메가 메뉴): 카테고리마다 한 열 — 제목 + 하위 카테고리 목록
                    const cols = categories.map(c => {
                        const links = (c.children || []).length
                            ? c.children.map(ch => `<li><a href="/products?category=${ch.categoryId}">${esc(ch.name)}</a></li>`).join('')
                            : `<li><a href="/products?category=${c.categoryId}">전체 보기</a></li>`;
                        return `<div class="mega__col">
                            <a class="mega__head" href="/products?category=${c.categoryId}">${esc(c.name)}</a>
                            <ul>${links}</ul>
                        </div>`;
                    }).join('');
                    document.getElementById('megaCols').innerHTML = cols + `
                        <div class="mega__col">
                            <a class="mega__head" href="/products?collab=true">컬렉션</a>
                            <ul><li><a href="/products?collab=true">콜라보 전체 보기</a></li></ul>
                        </div>`;
                })
                .catch(() => { /* 실패해도 "전체 상품" 링크는 그대로 사용 가능 */ });
        })();
    </script>
</div>
