<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>마이페이지</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/fragments/header.css" />
    <link rel="stylesheet" th:href="@{/css/profile.css}" />
</head>
<body>
<div th:replace="~{fragments/header :: headerWithBanner}"></div>

<div class="mypage">

    <!-- 프로필 -->
    <section class="card">
        <div class="profile-top">
            <!-- 아바타 자체가 업로드 버튼 -->
            <button type="button" class="avatar-wrap" id="avatarBtn" title="프로필 이미지 변경">
                <img id="profileImages" class="profile-img" alt="프로필 이미지"
                     th:src="${member.profileImgPath != null && !#strings.isEmpty(member.profileImgPath)} ? ${member.profileImgPath} : '/images/default_profile.svg'"
                     onerror="this.onerror=null; this.src='/images/default_profile.svg';" />
                <span class="avatar-badge"><i class="fa-solid fa-camera"></i></span>
            </button>
            <input type="file" id="ImagesUpload" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
            <div class="profile-meta">
                <p class="name" th:text="${member.info.nickname}">닉네임</p>
                <p class="email" th:text="${member.info.email}">email</p>
            </div>
        </div>

        <div class="profile-form">
            <div>
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" th:value="${member.info.nickname}" />
            </div>
            <div>
                <label for="genderSelect">성별</label>
                <select id="genderSelect">
                    <option value="">선택</option>
                    <option value="MALE" th:selected="${member.memberGender != null && member.memberGender.name() == 'MALE'}">남성</option>
                    <option value="FEMALE" th:selected="${member.memberGender != null && member.memberGender.name() == 'FEMALE'}">여성</option>
                </select>
            </div>
            <div>
                <label for="introduction">자기소개</label>
                <textarea id="introduction" rows="3" readonly th:text="${member.introduction}"></textarea>
            </div>
            <button type="button" class="btn-primary" id="updateProfileBtn">프로필 수정</button>
        </div>
    </section>

    <!-- 구매내역 -->
    <section class="card">
        <div class="section-head">
            <h3>구매내역</h3>
            <a href="/orders" class="more-link">더보기 &gt;</a>
        </div>
        <div id="orderList"><p class="empty">불러오는 중...</p></div>
    </section>

    <!-- 좋아요 -->
    <section class="card">
        <div class="section-head">
            <h3>좋아요</h3>
        </div>
        <div id="wishList"><p class="empty">불러오는 중...</p></div>
    </section>
</div>

<script th:inline="javascript">
    const memberId = /*[[${member.info.id}]]*/ null;
    if (!memberId) { alert("로그인이 필요합니다."); location.href = "/login"; }
    const apiBase = `/api/v1/profile/${memberId}`;
    const DEFAULT_IMG = '/images/default_profile.svg';

    const profileImg = document.getElementById('profileImages');
    const avatarBtn = document.getElementById('avatarBtn');
    const fileInput = document.getElementById('ImagesUpload');

    // 아바타 클릭 → 파일 선택 → 선택 즉시 업로드
    avatarBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { alert('5MB 이하의 이미지만 업로드할 수 있습니다.'); fileInput.value = ''; return; }

        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch(`${apiBase}/image`, { method: 'POST', body: formData });
            if (!res.ok) throw new Error();
            const path = await res.text();
            profileImg.src = path + '?t=' + Date.now();
        } catch (e) {
            alert('이미지 업로드에 실패했습니다.');
        } finally {
            fileInput.value = '';
        }
    });

    // 프로필 수정 (닉네임/성별)
    document.getElementById('updateProfileBtn').addEventListener('click', () => {
        const payload = {
            nickname: document.getElementById('nickname').value.trim(),
            gender: document.getElementById('genderSelect').value
        };
        if (!payload.nickname) { alert('닉네임을 입력하세요.'); return; }

        fetch(apiBase, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (!res.ok) throw new Error();
            alert('프로필이 수정되었습니다.');
            document.querySelector('.profile-meta .name').textContent = payload.nickname;
        })
        .catch(() => alert('프로필 수정에 실패했습니다.'));
    });

    const won = n => Number(n).toLocaleString() + '원';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusLabel = s => ({PENDING:'결제 대기', COMPLETE:'결제 완료', CANCELED:'주문 취소'}[s] || s || '');
    const IMG_FALLBACK = "this.onerror=null; this.src='/logo/icons/mufc_icon.png';";

    async function loadOrders() {
        const box = document.getElementById('orderList');
        try {
            const res = await fetch('/api/v1/order/my');
            if (!res.ok) throw new Error();
            const orders = (await res.json()).slice(0, 5);
            if (!orders.length) { box.innerHTML = '<p class="empty">구매내역이 없습니다.</p>'; return; }
            box.innerHTML = orders.map(o => `
                <div class="order-row">
                    <img class="order-thumb" src="${esc(o.thumbnail || '/logo/icons/mufc_icon.png')}" alt="" onerror="${IMG_FALLBACK}">
                    <div class="order-info">
                        <p class="order-date">${new Date(o.orderDate).toLocaleDateString('ko-KR')}</p>
                        <p class="order-name">${esc(o.productSummary)}</p>
                        <p class="order-no">주문번호 ${o.orderId}</p>
                    </div>
                    <div class="order-side">
                        <p class="order-price">${won(o.totalPrice)}</p>
                        <p class="order-status">${statusLabel(o.status)}</p>
                    </div>
                </div>`).join('');
        } catch (e) {
            box.innerHTML = '<p class="empty">구매내역을 불러오지 못했습니다.</p>';
        }
    }

    async function loadWishList() {
        const box = document.getElementById('wishList');
        try {
            const res = await fetch('/api/v1/wishlist/my');
            if (!res.ok) throw new Error();
            const items = await res.json();
            if (!items.length) { box.innerHTML = '<p class="empty">좋아요한 상품이 없습니다.</p>'; return; }
            box.innerHTML = '<div class="wish-grid">' + items.map(w => `
                <a class="wish-card" href="/products/${w.productId}">
                    <img src="${esc((w.productThumbnails && w.productThumbnails[0]) || '/logo/icons/mufc_icon.png')}" alt="" onerror="${IMG_FALLBACK}">
                    <p class="wish-name">${esc(w.productName)}</p>
                    <p class="wish-price">${won(w.price)}</p>
                </a>`).join('') + '</div>';
        } catch (e) {
            box.innerHTML = '<p class="empty">좋아요 목록을 불러오지 못했습니다.</p>';
        }
    }

    window.addEventListener('DOMContentLoaded', () => { loadOrders(); loadWishList(); });
</script>
</body>
</html>
