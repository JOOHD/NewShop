<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 주문 내역</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/admin/orderList.css">
    <link rel="stylesheet" href="/css/fragments/header.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<!-- 헤더 -->
<div th:replace="~{fragments/header :: headerWithBanner}"></div>

<div class="container mt-5">
    <h2 class="mb-4">📦 주문 관리</h2>

    <!-- 필터 & 검색 -->
    <div class="row mb-3">
        <div class="col-md-3">
            <select id="orderStatusFilter" class="form-select">
                <option value="">전체 상태</option>
                <option value="PENDING">결제 대기</option>
                <option value="PAID">결제 완료</option>
                <option value="SHIPPED">배송 중</option>
                <option value="DELIVERED">배송 완료</option>
            </select>
        </div>
        <div class="col-md-5">
            <input type="text" id="searchKeyword" class="form-control" placeholder="주문자명 / 주문번호 검색">
        </div>
        <div class="col-md-2">
            <button id="searchBtn" class="btn btn-primary w-100">검색</button>
        </div>
    </div>

    <!-- 주문 목록 테이블 -->
    <div class="table-responsive">
        <table class="table table-hover align-middle" id="orderTable">
            <thead class="table-light">
            <tr>
                <th>주문번호</th>
                <th>주문자</th>
                <th>전화번호</th>
                <th>총 결제금액</th>
                <th>주문 상태</th>
                <th>주문일시</th>
                <th>상세보기</th>
            </tr>
            </thead>
            <tbody>
            <!-- JS로 렌더링 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 주문 상세 모달 -->
<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">주문 상세</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="orderDetailContainer">
                    <!-- JS로 상세 렌더링 -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
    
        // 주문 상태 한글 변환 함수
        function formatStatus(status) {
            switch (status) {
                case "PENDING": return "결제 대기";
                case "PAID": return "결제 완료";
                case "SHIPPED": return "배송 중";
                case "DELIVERED": return "배송 완료";
                default: return "알 수 없음";
            }
        }
    
        // 주문 목록 불러오기
        async function loadOrders(filter = {}, keyword = "") {
            try {
                let query = new URLSearchParams();
                if (filter.status) query.append("status", filter.status);
                if (keyword) query.append("keyword", keyword);
    
                const res = await fetch("/api/v1/admin/orders?" + query.toString());
                if (!res.ok) throw new Error("주문 내역 조회 실패");
    
                const orders = await res.json();
                renderOrderTable(orders);
            } catch (e) {
                console.error(e);
                alert("주문 내역을 불러오는 중 오류가 발생했습니다.");
            }
        }
    
        // 주문 목록 테이블 렌더링
        function renderOrderTable(orders) {
            const tbody = document.querySelector("#orderTable tbody");
            tbody.innerHTML = "";
    
            if (!orders || orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center">등록된 주문이 없습니다.</td></tr>`;
                return;
            }
    
            orders.forEach(o => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${o.orderId}</td>
                    <td>${o.ordererName}</td>
                    <td>${o.phoneNumber}</td>
                    <td>${Number(o.totalPrice).toLocaleString()}원</td>
                    <td>${formatStatus(o.status)}</td>
                    <td>${new Intl.DateTimeFormat("ko-KR", {
                        dateStyle: "medium",
                        timeStyle: "short"
                    }).format(new Date(o.orderDate))}</td>
                    <td><button class="btn btn-sm btn-outline-primary view-detail-btn" data-order-id="${o.orderId}">상세보기</button></td>
                `;
                tbody.appendChild(tr);
            });
    
            // 상세보기 버튼 이벤트
            document.querySelectorAll(".view-detail-btn").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    const orderId = e.target.dataset.orderId;
                    const res = await fetch(`/api/v1/admin/orders/${orderId}`);
                    if (!res.ok) return alert("주문 상세 조회 실패");
                    const order = await res.json();
                    renderOrderDetailModal(order);
                    const modal = new bootstrap.Modal(document.getElementById('orderDetailModal'));
                    modal.show();
                });
            });
        }
    
        // 주문 상세 모달 렌더링
        function renderOrderDetailModal(order) {
            const container = document.getElementById("orderDetailContainer");
            let html = `
                <p><strong>주문번호:</strong> ${order.orderId}</p>
                <p><strong>주문자:</strong> ${order.ordererName}</p>
                <p><strong>전화번호:</strong> ${order.phoneNumber}</p>
                <p><strong>배송지:</strong> ${order.address ?? ""} ${order.detailAddress ?? ""}</p>
                <p><strong>총 결제금액:</strong> ${Number(order.totalPrice).toLocaleString()}원</p>
                <p><strong>주문 상태:</strong> ${formatStatus(order.status)}</p>
                <hr>
                <h6>주문 상품</h6>
                <ul class="list-group">`;
    
            if (order.products && order.products.length > 0) {
                order.products.forEach(p => {
                    html += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            ${p.name ?? p.productName} (${p.size ?? p.productSize}) x ${p.quantity} 
                            - ${Number(p.price).toLocaleString()}원
                        </li>`;
                });
            } else {
                html += `<li class="list-group-item text-center text-muted">주문 상품 정보가 없습니다.</li>`;
            }
    
            html += `</ul>`;
            container.innerHTML = html;
        }
    
        // 필터 & 검색 이벤트
        document.getElementById("searchBtn").addEventListener("click", () => {
            const status = document.getElementById("orderStatusFilter").value;
            const keyword = document.getElementById("searchKeyword").value;
            loadOrders({status}, keyword);
        });
    
        // 초기 로드
        loadOrders();
    });
</script>

<!-- Bootstrap의 동적 기능(예: 모달, 드롭다운, 토글 버튼, 툴팁 등)을 작동시키기 위해 필요한 JavaScript 파일입니다. -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
