<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>장바구니</title>
    <link rel="stylesheet" href="/css/fragments/header.css" />
    <link rel="stylesheet" href="/css/cart.css" />
</head>
<body>

<!-- 헤더 -->
<div th:replace="~{fragments/header :: headerWithBanner}"></div>

<div class="cart-container">
    <h2>🛒 장바구니</h2>

    <div class="cart-header">
        <label><input type="checkbox" id="select-all" /> 전체 선택</label>
        <button id="delete-selected">선택 삭제</button>
    </div>

    <div id="cart-items">
        <!-- JS로 장바구니 항목 렌더링 -->
    </div>

    <div class="cart-footer">
        <button id="change-options">옵션/배송 변경</button>
        <button id="order-now">바로 주문</button>
        <div class="price-summary">
            <p>상품 금액: <span id="total-price">0원</span></p>
            <p>배송비: <span id="delivery-fee">0원</span></p>
            <p>예상 결제금액: <span id="total-payment">0원</span></p>
        </div>
    </div>
</div>

<script>
    
    //  withAuth: JWT 쿠키 기반 인증 요청용 설정
    // credentials: 'include' 로 쿠키 전송
    function withAuth(init={}) {
        return Object.assign({
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            redirect: 'manual'
        }, init);
    }

    
    //  장바구니 조회
    async function fetchCartItems() {
        const res = await fetch('/api/v1/cart/my', withAuth());
        if (!res.ok) throw new Error("장바구니 조회 실패");
        const data = await res.json();
        renderCart(data.cartItems);
    }

    
    //  장바구니 렌더링
    // 원가격/할인율/총금액 표시
    // 수량 변경/삭제/전체 선택 기능 포함
    function renderCart(cartItems) {
        const container = document.getElementById('cart-items');
        container.innerHTML = '';

        if (!cartItems.length) {
            container.innerHTML = '<p>장바구니가 비어 있습니다.</p>';
            showPriceSummary(null);
            return;
        }

        cartItems.forEach(item => {
            const div = document.createElement('div');
            div.className = 'cart-item';
            div.innerHTML = `
                <input type="checkbox" class="item-select" data-cart-id="${item.cartId}" />
                <img src="${item.productThumbnailUrl}" alt="${item.productName}" class="product-img" />
                <div class="product-info">
                    <strong>${item.productName}</strong><br/>
                    <small>사이즈: ${item.size}</small>
                    <small>주문자: ${item.memberName}</small><br/>
                    <small>전화번호: ${item.phoneNumber}</small>
                </div>
                <div class="price-info">
                    <span class="original-price">${Number(item.originalPrice).toLocaleString()}원</span>
                    <span class="discount-rate">${item.discountRate}% 할인</span>
                    <span class="final-price">${Number(item.finalPrice).toLocaleString()}원</span>
                    <input type="number" min="1" value="${item.quantity}" onchange="updateCount(${item.cartId}, this.value)" />
                    <button onclick="deleteCartItem(${item.cartId})">삭제</button><br/>
                    <span class="total-price">총액: ${Number(item.totalPrice).toLocaleString()}원</span>
                </div>
            `;
            container.appendChild(div);
        });

        
        //  주문하기 클릭 시 tempOrder.html로 이동
        // 선택 상품만 sessionStorage에 담음
        document.getElementById('order-now').onclick = handleOrderNow;
        refreshPriceSummary();
    }

    
    //  수량 변경
    function updateCount(cartId, newCount) {
        if (newCount < 1) { alert('수량은 1 이상이어야 합니다.'); fetchCartItems(); return; }
        fetch(`/api/v1/cart/${cartId}`, withAuth({ method:'PUT', body:JSON.stringify({ quantity: parseInt(newCount, 10) }) }))
            .then(res => res.ok ? fetchCartItems() : Promise.reject('수량 변경 실패'))
            .catch(err => { alert(err); fetchCartItems(); });
    }

    
    //  개별 삭제
    function deleteCartItem(cartId) {
        if (!confirm('삭제하시겠습니까?')) return;
        fetch(`/api/v1/cart/${cartId}`, withAuth({ method:'DELETE' }))
            .then(res => res.ok ? fetchCartItems() : Promise.reject('삭제 실패'))
            .catch(err => alert(err));
    }

    
    //  주문하기 클릭 이벤트
    // - JWT 쿠키로 로그인 사용자 정보 확인
    // - 선택 상품만 sessionStorage에 저장
    async function handleOrderNow() {
        const selectedItems = [...document.querySelectorAll('.item-select:checked')];
        if (!selectedItems.length) return alert('선택된 상품이 없습니다.');

        let memberInfo;
        try {
            const res = await fetch('/api/v1/members/member-info', withAuth());
            if (!res.ok) throw new Error('회원 정보 불러오기 실패');
            memberInfo = await res.json();
        } catch(e) { alert(e); return; }

        // 금액·단가·배송비는 화면에서 계산하지 않고 서버 미리보기 응답을 그대로 쓴다.
        let preview;
        try {
            preview = await fetchPreview(selectedItems.map(cb => parseInt(cb.dataset.cartId, 10)));
        } catch(e) { alert(e.message); return; }

        const orderProducts = preview.lines.map(line => ({
            cartId: line.cartId,
            name: line.productName,
            size: line.size,
            Images: line.thumbnailPath,
            quantity: line.quantity,
            price: line.linePrice              // 상품별 합계 (표시용)
        }));

        const orderDto = {
            memberId: memberInfo.id,
            ordererName: memberInfo.ordererName || memberInfo.username || "-",
            phoneNumber: memberInfo.phoneNumber || "-",
            // 아래 금액도 서버 미리보기 값(표시용). 실제 결제 금액은 주문 생성 시 서버가 다시 확정한다.
            totalPrice: preview.payAmount,
            itemsTotal: preview.itemsTotal,
            deliveryFee: preview.deliveryFee,
            cartIds: orderProducts.map(p => p.cartId),   // 서버 주문 생성에 사용
            products: orderProducts
        };

        sessionStorage.setItem('orderDto', JSON.stringify(orderDto));
        window.location.href = '/tempOrder';
    }

    
    //  서버에 금액 미리보기 요청 — 상품 합계, 배송비, 결제 금액은 서버 규칙으로 계산된다 (화면은 계산하지 않음)
    async function fetchPreview(cartIds) {
        const res = await fetch('/api/v1/order/preview', withAuth({
            method: 'POST',
            body: JSON.stringify({ cartIds })
        }));
        if (!res.ok) throw new Error('금액 계산에 실패했습니다.');
        return res.json();
    }

    //  선택한 상품의 금액을 서버에서 받아 UI에 반영 (선택이 없으면 0원)
    async function refreshPriceSummary() {
        const selected = [...document.querySelectorAll('.item-select:checked')]
            .map(cb => parseInt(cb.dataset.cartId, 10));
        if (!selected.length) { showPriceSummary(null); return; }

        try {
            showPriceSummary(await fetchPreview(selected));
        } catch (e) {
            showPriceSummary(null);
            alert(e.message);
        }
    }

    function showPriceSummary(preview) {
        const won = v => Number(v).toLocaleString() + '원';
        document.getElementById('total-price').textContent = preview ? won(preview.itemsTotal) : '0원';
        document.getElementById('delivery-fee').textContent = preview ? won(preview.deliveryFee) : '0원';
        document.getElementById('total-payment').textContent = preview ? won(preview.payAmount) : '0원';
    }

    
    //  선택 삭제 & 전체 선택 기능
    document.getElementById('delete-selected').addEventListener('click', () => {
        const selected = [...document.querySelectorAll('.item-select:checked')];
        if (!selected.length) return alert('선택된 상품이 없습니다.');
        if (!confirm(`${selected.length}건을 삭제하시겠습니까?`)) return;

        Promise.all(selected.map(cb=>fetch(`/api/v1/cart/${cb.dataset.cartId}`,withAuth({method:'DELETE'}))))
            .then(()=>fetchCartItems())
            .catch(()=>alert('삭제 실패'));
    });

    document.getElementById('select-all').addEventListener('change', function() {
        document.querySelectorAll('.item-select').forEach(cb=>cb.checked=this.checked);
        refreshPriceSummary();
    });

    // 개별 체크박스를 바꾸면 선택한 상품 기준으로 금액을 다시 받아 온다
    document.getElementById('cart-items').addEventListener('change', function(e) {
        if (e.target.classList.contains('item-select')) refreshPriceSummary();
    });

    fetchCartItems();
</script>

</body>
</html>
