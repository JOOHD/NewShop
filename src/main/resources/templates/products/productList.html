<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link rel="stylesheet" href="/css/fragments/header.css">
    <link rel="stylesheet" href="/css/productList.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- 헤더 (사이드바/검색 패널 포함) -->
<div th:replace="~{fragments/header :: headerWithBanner}"></div>

<!-- 페이지 제목 -->
<h2 class="list-title" th:text="${title}">전체 상품</h2>

<!-- 카테고리 칩: 전체 + 최상위 카테고리, 선택한 카테고리의 하위 카테고리 -->
<nav class="category-nav">
    <a class="category" th:classappend="${selectedCategoryId == null and !collab} ? 'active'" href="/products">전체</a>
    <a class="category" th:classappend="${collab} ? 'active'" href="/products?collab=true">콜라보</a>
    <th:block th:each="top : ${categories}">
        <a class="category"
           th:classappend="${selectedCategoryId != null and selectedCategoryId == top.categoryId} ? 'active'"
           th:href="@{/products(category=${top.categoryId})}" th:text="${top.name}">상위</a>
        <th:block th:if="${selectedTopId != null and selectedTopId == top.categoryId}" th:each="child : ${top.children}">
            <a class="category category--child"
               th:classappend="${selectedCategoryId != null and selectedCategoryId == child.categoryId} ? 'active'"
               th:href="@{/products(category=${child.categoryId})}" th:text="${child.name}">하위</a>
        </th:block>
    </th:block>
</nav>

<p class="list-count" th:text="'총 ' + ${#lists.size(products)} + '개'">총 0개</p>

<main class="product-list">
    <!-- DTO 기반 상품 반복 -->
    <article class="product-item" th:each="product : ${products}">
        <!-- 상세 페이지 링크 -->
        <a th:href="@{'/products/' + ${product.productId}}">
            <div class="thumbnail">
                <!-- 단일 썸네일 출력 -->
                <img th:src="${#lists.isEmpty(product.productThumbnails)} ? '/logo/icons/mufc_icon.png' : ${product.productThumbnails[0]}"
                     alt="상품 이미지"
                     class="thumbnail-Images"
                     onerror="this.onerror=null; this.src='/logo/icons/mufc_icon.png';" />

                <!-- 할인 태그 -->
                <span class="tag" th:if="${product.isDiscount}">할인</span>
            </div>

            <div class="info">
                <!-- 가격 표시 -->
                <p class="price" th:if="${product.isDiscount}">
                    <span class="original-price" th:text="'₩' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}">₩0</span>
                    <span class="discount-rate" th:text="${product.discountRate + '% 할인'}">10% 할인</span>
                    <span class="discounted-price"
                          th:text="'₩' + ${#numbers.formatInteger(product.price * (1 - product.discountRate / 100.0), 0, 'COMMA')}">₩0</span>
                </p>
                <p class="price" th:unless="${product.isDiscount}">
                    <span class="discount-price" th:text="'₩' + ${#numbers.formatInteger(product.price, 0, 'COMMA')}">₩0</span>
                </p>

                <!-- 상품명 -->
                <p class="name" th:text="${product.productName}">상품명</p>

                <!-- 등록일 표시 -->
                <p class="created-at" th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd')}">등록일</p>
            </div>
        </a>
    </article>
    <p class="empty" th:if="${#lists.isEmpty(products)}">해당하는 상품이 없습니다.</p>
</main>

</body>
</html>
